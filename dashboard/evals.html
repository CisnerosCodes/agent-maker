<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawColony — Instruction-Following Ladder</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* Obsidian theme — matches Mission Control (mockup 3a). */
    :root {
      --paper: #0b0812; --card: #120e1c;
      --ink: #ece8f4; --ink-dim: #a49bbd; --ink-mute: #6e6488;
      --line: #241d36; --line-dark: #322a4a;
      --accent: #8b5cf6; --accent-ink: #c4b5fd;
      --green: #4cc38a; --amber: #d9a441; --amber-soft: rgba(217, 164, 65, 0.1); --red: #e5688a;
      --radius: 10px;
    }
    body { background: var(--paper); color: var(--ink); margin: 0; padding: 1.6rem clamp(1rem, 3vw, 2.5rem) 3rem; font-size: 14px; }
    a { color: var(--accent-ink); text-decoration: none; }
    h1 { font-family: var(--font-serif); font-weight: 400; font-size: 1.7rem; margin: 0 0 0.3rem; letter-spacing: 0.005em; }
    h1 .dim { color: var(--ink-mute); }
    .meta { color: var(--ink-mute); font-size: 0.8rem; margin-bottom: 1.2rem; }
    select { background: var(--card); color: var(--ink); border: 1px solid var(--line-dark); border-radius: 8px; padding: 0.3rem 0.5rem; font-family: var(--font-sans); font-size: 0.8rem; }
    .note { border: 1px solid rgba(217, 164, 65, 0.4); background: var(--amber-soft); color: var(--amber); font-size: 0.78rem;
            padding: 0.65rem 0.95rem; border-radius: var(--radius); margin-bottom: 1.1rem; max-width: 70rem; line-height: 1.55; }
    .summary { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .stat { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 0.85rem 1.15rem; min-width: 13rem; }
    .stat .n { font-size: 1.5rem; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
    .stat .n .u { font-size: 0.72rem; color: var(--ink-mute); font-weight: 500; }
    .stat .l { font-size: 0.68rem; color: var(--ink-dim); margin-top: 0.2rem; font-family: var(--font-mono); }
    table { border-collapse: separate; border-spacing: 0; width: 100%; max-width: 76rem; font-size: 0.8rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    th, td { border-bottom: 1px solid var(--line); padding: 0.55rem 0.8rem; text-align: left; }
    tr:last-child td { border-bottom: none; }
    th { background: #161022; color: var(--ink-dim); font-weight: 600; font-size: 0.72rem; }
    td.pass { color: var(--green); font-weight: 500; } td.fail { color: var(--red); font-weight: 500; } td.partial { color: var(--amber); font-weight: 500; }
    tr.tier td.tierlabel { color: var(--accent-ink); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.12em; background: #161022; font-family: var(--font-mono); }
    details { margin: 0.2rem 0; }
    summary { cursor: pointer; color: var(--ink-mute); font-size: 0.7rem; }
    pre { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem;
          font-family: var(--font-mono); font-size: 0.7rem; white-space: pre-wrap; word-break: break-word; max-height: 14rem; overflow-y: auto; }
    .foot { font-size: 0.72rem; color: var(--ink-mute); max-width: 60rem; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Instruction-Following Ladder <span class="dim">— agent reliability harness</span></h1>
  <div class="meta"><a href="/app">Back to Mission Control</a> &nbsp;·&nbsp; <a href="/">Landing</a> &nbsp;·&nbsp; run: <select id="runSel"></select></div>
  <div id="note" class="note" style="display:none"></div>
  <div class="summary" id="summary"></div>
  <div id="matrix"></div>

  <script>
    let runs = [];
    let selected = 0;

    function pct(r) { return r === 1 ? "PASS" : r === 0 ? "FAIL" : Math.round(r * 100) + "%"; }
    function cls(r) { return r === 1 ? "pass" : r === 0 ? "fail" : "partial"; }
    function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

    function render() {
      const run = runs[selected];
      const sel = document.getElementById("runSel");
      sel.innerHTML = runs.map((r, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>${r.id} (${r.backend})</option>`).join("");
      if (!run) { document.getElementById("matrix").innerHTML = "<p>No eval runs yet. Run: <code>npm run eval</code></p>"; return; }

      const note = document.getElementById("note");
      note.style.display = run.runnerNote ? "block" : "none";
      note.textContent = run.runnerNote || "";

      document.getElementById("summary").innerHTML = run.models.map(m => `
        <div class="stat">
          <div class="n">${Math.round((m.csr ?? m.isr ?? 0) * 100)}% <span class="u">CSR</span></div>
          <div class="l">${esc(m.model)}</div>
          <div class="l">ISR ${Math.round((m.isr ?? 0) * 100)}% · pass^${m.k ?? 1} ${Math.round((m.passK ?? 0) * 100)}%</div>
          <div class="l">cleared ${m.cleared}/${m.total} · break: ${m.breakingPoint ? esc(m.breakingPoint) : "none"}</div>
          ${m.tierCsr ? `<div class="l">curve: ${Object.entries(m.tierCsr).map(([t,v]) => `${t.slice(0,4)} ${Math.round(v*100)}%`).join(" → ")}</div>` : ""}
          ${m.avgLatencyMs != null ? `<div class="l">avg ${m.avgLatencyMs}ms</div>` : ""}
        </div>`).join("");

      const nLevels = run.models[0].levels.length;
      let rows = "";
      let lastTier = "";
      for (let i = 0; i < nLevels; i++) {
        const base = run.models[0].levels[i];
        if (base.tier !== lastTier) {
          lastTier = base.tier;
          rows += `<tr class="tier"><td class="tierlabel" colspan="${2 + run.models.length}">tier: ${base.tier}</td></tr>`;
        }
        const cells = run.models.map(m => {
          const r = m.levels[i];
          const csr = r.csr ?? r.passRate ?? 0, isr = r.isr ?? r.passRate ?? 0;
          const icon = isr === 1 ? "PASS" : isr === 0 ? "FAIL" : "PART";
          const detail = r.trials.map(t => {
            const cons = (t.constraints || []).map(c => `${c.pass ? "✓" : "✗"} ${c.axis ? "["+c.axis+"] " : ""}${esc(c.label)}`).join("\n");
            return `<details><summary>trial ${t.trial}: ${Math.round((t.csr ?? (t.pass?1:0))*100)}% CSR${t.pass ? " (full pass)" : ""}</summary>` +
              `<pre>${cons}\n---\n${esc(t.response)}</pre></details>`;
          }).join("");
          return `<td class="${cls(isr)}">${icon} · ${Math.round(csr*100)}%${detail}</td>`;
        }).join("");
        rows += `<tr><td>${i + 1}</td><td>${esc(base.title)}</td>${cells}</tr>`;
      }
      document.getElementById("matrix").innerHTML =
        `<table><tr><th>#</th><th>Level</th>${run.models.map(m => `<th>${esc(m.model)}</th>`).join("")}</tr>${rows}</table>` +
        `<p class="foot">CSR = fraction of a level's constraints met (partial credit, AgentIF). ISR = all met (strict gate). pass^k = reliability: chance a random k of the trials all fully pass (τ²-bench). Adversarial levels split into [utility] and [security] axes (AgentDojo).</p>`;
    }

    document.getElementById("runSel").addEventListener("change", (e) => { selected = Number(e.target.value); render(); });

    async function refresh() {
      try {
        const res = await fetch("/api/eval-runs");
        const fresh = await res.json();
        const changed = JSON.stringify(fresh) !== JSON.stringify(runs);
        runs = fresh;
        if (changed) render();
      } catch {}
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
