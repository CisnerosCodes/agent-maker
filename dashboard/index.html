<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Agent Corp — Live</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #0b0e14; color: #d6deeb; margin: 2rem; }
    h1 { font-size: 1.2rem; letter-spacing: 0.1em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #2a3040; border-radius: 8px; padding: 1rem; background: #121722; }
    .card.ceo { border-color: #f5a623; }
    .status { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
    .working { background: #123c22; color: #5ff59a; }
    .blocked { background: #4a1220; color: #ff6b81; }
    .provisioning, .starting { background: #103046; color: #61c3ff; }
    .done { background: #1e2a12; color: #b8e986; }
    .log { font-size: 0.7rem; color: #8a93a6; max-height: 8rem; overflow-y: auto; margin-top: 0.5rem; }
    button { background: #1d2635; color: inherit; border: 1px solid #3a4358; border-radius: 6px; padding: 0.3rem 0.8rem; cursor: pointer; }
    button.deny { border-color: #7a2030; }
  </style>
</head>
<body>
  <h1>AGENT CORP — LIVE ORG CHART <a href="/evals" style="color:#61c3ff;font-size:0.8rem;text-decoration:none">→ model evals</a></h1>
  <div class="grid" id="grid"></div>
  <script>
    const agents = new Map();
    const grid = document.getElementById("grid");
    function render() {
      grid.innerHTML = "";
      for (const a of agents.values()) {
        const card = document.createElement("div");
        card.className = "card" + (a.spec?.role === "ceo" ? " ceo" : "");
        card.innerHTML = `
          <strong>${a.id}</strong> <span class="status ${a.status}">${a.status}</span>
          <div>${a.identity?.email ?? ""}</div>
          <div>${a.spec?.objective ?? ""}</div>
          ${a.status === "blocked" ? `<button onclick="fetch('/approve/${a.id}',{method:'POST'})">Approve</button>
             <button class="deny" onclick="fetch('/deny/${a.id}',{method:'POST'})">Deny</button>` : ""}
          <div class="log">${(a.log ?? []).slice(-6).map(e => `${e.ts.slice(11,19)} ${e.message}`).join("<br>")}</div>`;
        grid.appendChild(card);
      }
    }
    const es = new EventSource("/events");
    es.onmessage = (ev) => {
      const data = JSON.parse(ev.data);
      if (data.snapshot) for (const a of data.snapshot) agents.set(a.id, a);
      else agents.set(data.id, data);
      render();
    };
  </script>
</body>
</html>
