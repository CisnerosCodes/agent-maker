<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent-Maker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#0a0e12; overflow:hidden; }
  body {
    font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace;
    color:#d7e0e8; display:flex; align-items:center; justify-content:center;
  }
  .wrap { text-align:center; max-width:1100px; padding:0 48px; }
  .badge {
    display:inline-block; font-size:13px; letter-spacing:.28em; color:#5f7385;
    border:1px solid #24303a; padding:8px 18px; border-radius:4px;
    margin-bottom:44px; text-transform:uppercase;
    animation:fade .9s ease both;
  }
  h1 {
    font-size:88px; font-weight:700; letter-spacing:-.01em; color:#f2f6f9;
    animation:fade .9s .15s ease both;
  }
  h1 .accent { color:#3ddc84; }
  .tagline {
    margin-top:34px; font-size:26px; line-height:1.55; color:#aebbc7;
    animation:fade .9s .35s ease both;
  }
  .tagline strong { color:#f2f6f9; font-weight:700; }
  .pills {
    margin-top:40px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
    animation:fade .9s .55s ease both;
  }
  .pill {
    font-size:15px; letter-spacing:.08em; color:#3ddc84;
    border:1px solid #1d4030; background:#0e1a14; padding:9px 20px; border-radius:999px;
  }
  .foot {
    margin-top:64px; font-size:14px; color:#4c5d6c; letter-spacing:.12em;
    animation:fade .9s .75s ease both;
  }
  @keyframes fade { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">AITX &times; NVIDIA Claw Agent Hackathon &middot; July 2026</div>
    <h1>AGENT<span class="accent">-</span>MAKER</h1>
    <div class="tagline">
      Everyone sells agents.<br>
      <strong>We sell the employment contract.</strong>
    </div>
    <div class="pills">
      <span class="pill">identity</span>
      <span class="pill">permissions</span>
      <span class="pill">supervision</span>
      <span class="pill">audit trail</span>
    </div>
    <div class="foot">A SELF-EXPANDING AGENT COMPANY IN A BOX</div>
  </div>
</body>
</html>
