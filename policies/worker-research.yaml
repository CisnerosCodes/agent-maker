# OpenShell policy — Research worker
# Spec: openshell-policy.spec.md §3.  Owner: Sky (security lane).
#
# Story for judges: this worker drives real research, but the boundary lives HERE,
# not in the agent's goodwill. Its ONLY egress is Nemotron inference. Document
# ingest is HARNESS-BROKERED (the Factory fetches + scan()s Apify results, then
# hands the clean text into the sandbox) — so the sandbox never fetches un-scanned
# bytes and every ingested doc is forced through HiddenLayer (Layer 1 of the
# poisoned-doc demo). Everything else (incl. api.apify.com AND evil.example) is
# default-deny — that is Layer 2, independent of HiddenLayer.
#
# Static sections (filesystem_policy, process, landlock) LOCK at `nemoclaw onboard`
# time — they must be correct before Phase A. network_policies is hot-reloadable
# via `openshell policy set` in Phase B. See nemoclaw-spawn.spec.md §3.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr/lib/**
    - /usr/local/lib/**
  read_write:
    - /workspace/**
    - /tmp

process:
  run_as_user: sandbox
  run_as_group: sandbox

landlock:
  compatibility: best_effort

network_policies:
  # NO apify endpoint here — Apify ingest is harness-brokered (see header), so the
  # research sandbox never fetches external documents itself. The sandbox's only
  # egress is inference. Default-deny still independently blocks the evil.example
  # exfil (poisoned-doc demo Layer 2), regardless of HiddenLayer.
  nvidia_inference:
    name: nvidia-inference
    endpoints:
      # ONLY needed if routed inference does NOT exit via the localhost gateway.
      # Confirm at onboarding (open item, spec §6). If it exits via the gateway,
      # delete this whole entry and the sandbox has zero direct egress (strongest
      # default-deny).
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
        # nvapi key injected at the gateway as openshell:resolve:env:NVIDIA_API_KEY —
        # the sandbox holds a placeholder, never the raw nvapi- token.
        request_body_credential_rewrite: true
    binaries:
      - path: /usr/local/bin/openclaw
      - path: /usr/bin/node
